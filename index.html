<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bradley Yandow Email Signature</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 24px;
  background: #ffffff;
  color: #111111;
}

.preview-image {
  display: block;
  width: 500px;
  max-width: 100%;
  height: auto;
  border: 0;
}

button {
  margin-top: 24px;
  padding: 14px 22px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 10px;
  border: 0;
  background: #007aff;
  color: #ffffff;
}

#status {
  margin-top: 15px;
  font-size: 16px;
}

@media only screen and (max-width: 600px) {
  .preview-image {
    width: 375px !important;
  }
}
</style>
</head>

<body>

<h2>TEST — Adaptive Signature</h2>
<p>500px desktop | 375px mobile | hidden hyphen anchor</p>

<img
  class="preview-image"
  src="https://otxhq.github.io/Brad-sig/bradley-signature.jpg"
  alt="Bradley Yandow | Teejayo Solutions LLC"
>

<button onclick="copySignature()">Copy Signature</button>

<div id="status"></div>

<script>
async function copySignature() {

  const html = `
    <style>
      .bradley-signature-image {
        display: block;
        width: 500px;
        max-width: 100%;
        height: auto;
        border: 0;
      }

      @media only screen and (max-width: 600px) {
        .bradley-signature-image {
          width: 375px !important;
        }
      }
    </style>

    <div style="margin:0;padding:0;">
      <span style="font-size:1px;line-height:1px;color:transparent;">-</span>
      <br>

      <img
        class="bradley-signature-image"
        src="https://otxhq.github.io/Brad-sig/bradley-signature.jpg"
        width="500"
        alt="Bradley Yandow | Teejayo Solutions LLC"
        style="display:block;width:500px;max-width:100%;height:auto;border:0;"
      >
    </div>
  `;

  const plain = "-";

  try {

    const htmlBlob = new Blob(
      [html],
      { type: "text/html" }
    );

    const textBlob = new Blob(
      [plain],
      { type: "text/plain" }
    );

    const item = new ClipboardItem({
      "text/html": htmlBlob,
      "text/plain": textBlob
    });

    await navigator.clipboard.write([item]);

    document.getElementById("status").innerText =
      "✓ Adaptive signature copied — 500px desktop / 375px mobile.";

  } catch (error) {

    document.getElementById("status").innerText =
      "Copy failed: " + error;

  }
}
</script>

</body>
</html>
