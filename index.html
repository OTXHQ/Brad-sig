<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Bradley Yandow Email Signature</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 24px;
  background: #ffffff;
  color: #111111;
}

.preview {
  display: block;
  width: 500px;
  max-width: 100%;
  height: auto;
  border: 0;
}

button {
  margin-top: 24px;
  padding: 14px 22px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 10px;
  border: 0;
  background: #007aff;
  color: #ffffff;
}

#status {
  margin-top: 15px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2>TEST — Inline Responsive</h2>

<p>500px desktop target | mobile constrained | hidden anchor</p>

<img
  class="preview"
  src="https://otxhq.github.io/Brad-sig/bradley-signature.jpg"
  alt="Bradley Yandow | Teejayo Solutions LLC"
>

<br>

<button onclick="copySignature()">Copy Signature</button>

<div id="status"></div>

<script>
async function copySignature() {

  const html = `
    <table
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="border-collapse:collapse;margin:0;padding:0;"
    >
      <tr>
        <td style="margin:0;padding:0;">

          <span
            style="font-size:1px;line-height:1px;color:transparent;"
          >-</span>

          <br>

          <img
            src="https://otxhq.github.io/Brad-sig/bradley-signature.jpg"
            width="500"
            alt="Bradley Yandow | Teejayo Solutions LLC"
            style="
              display:block;
              width:500px;
              max-width:100%;
              height:auto;
              border:0;
              margin:0;
              padding:0;
            "
          >

        </td>
      </tr>
    </table>
  `;

  const plain = "-";

  try {

    const htmlBlob = new Blob(
      [html],
      { type: "text/html" }
    );

    const textBlob = new Blob(
      [plain],
      { type: "text/plain" }
    );

    const item = new ClipboardItem({
      "text/html": htmlBlob,
      "text/plain": textBlob
    });

    await navigator.clipboard.write([item]);

    document.getElementById("status").innerText =
      "✓ Inline-responsive signature copied.";

  } catch (error) {

    document.getElementById("status").innerText =
      "Copy failed: " + error;

  }
}
</script>

</body>
</html>
