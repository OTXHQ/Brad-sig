<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bradley Yandow Email Signature</title>

<style>
body {
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  padding: 24px;
  background: #ffffff;
  color: #111111;
}

.preview img {
  display: block;
  width: 500px;
  max-width: 100%;
  height: auto;
  border: 0;
}

button {
  margin-top: 24px;
  padding: 14px 22px;
  font-size: 17px;
  font-weight: 600;
  border-radius: 10px;
  border: 0;
  background: #007aff;
  color: #ffffff;
}

#status {
  margin-top: 15px;
  font-size: 16px;
}
</style>
</head>

<body>

<h2>Bradley Yandow Email Signature</h2>
<p>500px test | simple working structure | hidden anchor</p>

<div class="preview">
  <img
    src="https://otxhq.github.io/Brad-sig/bradley-signature.jpg"
    alt="Bradley Yandow | Teejayo Solutions LLC"
  >
</div>

<button onclick="copySignature()">Copy Signature</button>

<div id="status"></div>

<script>
async function copySignature() {

  const html = `
    <div style="margin:0;padding:0;">
      <span style="font-size:1px;line-height:1px;color:transparent;">-</span>
      <br>
      <img
        src="https://otxhq.github.io/Brad-sig/bradley-signature.jpg"
        width="500"
        alt="Bradley Yandow | Teejayo Solutions LLC"
        style="display:block;width:500px;max-width:100%;height:auto;border:0;"
      >
    </div>
  `;

  const plain = "-";

  try {

    const htmlBlob = new Blob(
      [html],
      { type: "text/html" }
    );

    const textBlob = new Blob(
      [plain],
      { type: "text/plain" }
    );

    const item = new ClipboardItem({
      "text/html": htmlBlob,
      "text/plain": textBlob
    });

    await navigator.clipboard.write([item]);

    document.getElementById("status").innerText =
      "✓ 500px signature copied.";

  } catch (error) {

    document.getElementById("status").innerText =
      "Copy failed: " + error;

  }
}
</script>

</body>
</html>
